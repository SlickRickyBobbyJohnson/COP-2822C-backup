<!DOCTYPE html>
<html>
<head>
  <title>Math Comparison Program</title>
</head>
<body>
  <h1>Enter Two Numbers</h1>
  <label for="x">Enter first number (x): </label>
  <input type="number" id="x"><br><br>

  <label for="y">Enter second number (y): </label>
  <input type="number" id="y"><br><br>

  <button onclick="calculate()">Calculate</button>

  <h2>Results:</h2>
  <p id="sumResult"></p>
  <p id="productResult"></p>
  <p id="comparisonResult"></p>

  <script>
    function calculate() {
      const x = parseFloat(document.getElementById("x").value);
      const y = parseFloat(document.getElementById("y").value);

      if (isNaN(x) || isNaN(y)) {
        alert("Please enter two valid numbers.");
        return;
      }

      const sum = x + y;
      const product = x * y;
      let comparison = "";

      if (x > y) {
        comparison = "x is bigger than y.";
      } else if (y > x) {
        comparison = "y is bigger than x.";
      } else {
        comparison = "x and y are equal.";
      }

      document.getElementById("sumResult").textContent = `The sum of x and y is ${sum}.`;
      document.getElementById("productResult").textContent = `The product of x and y is ${product}.`;
      document.getElementById("comparisonResult").textContent = comparison;
    }
  </script>
</body>
</html>
